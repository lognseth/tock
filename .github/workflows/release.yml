name: Release

# Push a tag like v1.1.0 (or v1.2.0-rc1 for a pre-release) to build, sign, notarize
# and publish a DMG on GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 25   # a hung signing/notarization step should fail, not sit for hours
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Self-tests
        run: ./build.sh test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)".*/\1/')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./build.sh dmg

      # Stable releases only: Sparkle's feed is the newest non-prerelease release's appcast.xml,
      # so release candidates never reach people who have the app installed.
      - name: Sign update for Sparkle
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          VERSION="${GITHUB_REF_NAME#v}"
          ./Scripts/make-appcast.sh "build/Tock-$VERSION.dmg" "$VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/sparkle.key"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="build/Tock-*.dmg"
          FLAGS=""
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS="--prerelease" ;;
            *) FILES="$FILES build/appcast.xml" ;;
          esac
          gh release create "$GITHUB_REF_NAME" $FILES --generate-notes $FLAGS

      # Stable releases only. Needs a fine-grained token with Contents: write on the tap repository.
      - name: Update Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lognseth/homebrew-tock.git" "$RUNNER_TEMP/tap"
          ./Scripts/update-cask.sh "build/Tock-$VERSION.dmg" "$VERSION" "$RUNNER_TEMP/tap/Casks/tock.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tock.rb
          git diff --cached --quiet || git commit -m "tock $VERSION" && git push origin HEAD

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"
          rm -rf "$RUNNER_TEMP/tap"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
